<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruz AutoParts</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
  </head>
</head>
<body>
    <header>
        <div class="titulo">
            <h1 class="titulo-prin">CRUZ</h1>
            <h1 class="h1_2">AUTOPARTS</h1>
        </div>
    </header>

    <main>
        <div class="card-about">
            <h2>Sobre nosotros</h2>
            <div class="about">  
                <p class="content">Empresa familiar dedicada a la venta de repuestos automotrices (frenos, filtros, baterias, aceites y mas). Con una preparación rapida de pedidos</p>
                <img src="./img/about_foto.png" alt="Sobre nosotros" class="foto_auto">
            </div>
        </div>

        <div class="productos">
            <div class="card-product">
                <img src="./img/producto1.jpeg" alt="Producto 1">
                <h3>$83</h3>
            </div>
            <div class="card-product">
                <img src="./img/producto3.jpeg" alt="Producto 2">
                <h3>$150</h3>
            </div>
            <div class="card-product">
                <img src="./img/producto2.jpeg" alt="Producto 3">
                <h3>$1,000</h3>
            </div>
        </div>

        <div>
            <h2>Encuentranos!</h2>
            <div class="mapa">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1734.4012208356853!2d-89.07638827089954!3d13.718183789737406!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f6349709fc494fb%3A0x225d8fcf213e2235!2sCruz%20Autoparts%201!5e0!3m2!1ses!2ssv!4v1778553798958!5m2!1ses!2ssv" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </main>

    <footer>
        <div>
            <p>&copy; Anthony Arias 2026. All rights reserved.</p>
        </div>
    </footer>

    
</body>
</html>
